name: Stability tests

# The mod and RuntimeChecks need the game's assemblies, which cannot be redistributed, so only StabilityTests runs here.
# It needs no game files: it builds TimberNet, links the mod's game-free sources and runs the mod project's PostBuild
# step into a scratch folder (see StabilityTests/README.md).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        id: dotnet
        with:
          dotnet-version: 8.0.x
      # The runner also has newer SDKs, and without a global.json the dotnet CLI picks the newest. Pin the SDK just
      # installed, on the runner only (a global.json in the repository would also pin developers' mod builds). It sits
      # at the repository root, so the Workshop checks' child msbuild uses it too.
      - name: Pin the .NET 8 SDK
        run: dotnet new globaljson --sdk-version ${{ steps.dotnet.outputs.dotnet-version }} --force
      - name: Check the SDK in use
        shell: pwsh
        run: |
          $sdk = dotnet --version
          "Using .NET SDK $sdk"
          if ($LASTEXITCODE -ne 0 -or -not "$sdk".StartsWith('8.0.')) { exit 1 }
      # BeaverBuddies/NuGet.Config names only the BepInEx feed and applies only to the mod project. StabilityTests and
      # TimberNet need Newtonsoft.Json from nuget.org, so name that source rather than rely on the runner's defaults.
      - name: Restore
        run: dotnet restore StabilityTests/StabilityTests.csproj --source https://api.nuget.org/v3/index.json
      - name: Run StabilityTests
        run: dotnet run --project StabilityTests --no-restore
